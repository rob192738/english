const app=document.getElementById('app');let flt='Tous',sec='theo';
const setSec=x=>{sec=x;document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.n===x))};

const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function home(){
 if(sec==='lec')return lhome();
 if(sec==='voc')return vhome();
 const lv=['A1','A2','B1','B2','C1','C2'],n=D.reduce((c,d)=>c+d[2].length,0);
 setSec(sec);
 let h=sec==='exo'?`<h1>Exercices</h1><p>${D.length} séries, ${n} exercices corrigés tout de suite. Choisis une série ou un test mixte.</p>`:`<h1>Théorie</h1><p>${D.length} fiches de cours avec règles et exemples. Ouvre une fiche, puis passe aux exercices.</p>`;h+=`<div class="chips" style="margin-top:14px">`;

function run(title,qs,id){
 let i=0,sc=0;const miss=[];setSec(qs[0]&&qs[0].v?'voc':qs[0]&&qs[0].r?'lec':'exo');
 function step(){
  if(i>=qs.length){
   if(id>=0&&sc>(+get('b'+id)||0))set('b'+id,sc);
   app.innerHTML=`<button class="back" id="bk">← Catalogue</button><h1>${title}</h1><div class="q"><div class="s">Score : ${sc} / ${qs.length}</div><p>${sc===qs.length?'Parfait !':sc>=qs.length*.7?'Très bien, encore un petit effort.':'Relis la fiche de cours et recommence.'}</p><p><button class="go" id="again">Recommencer</button></p></div>`;
   app.insertAdjacentHTML('beforeend',review(miss));document.getElementById('bk').onclick=home;document.getElementById('again').onclick=()=>run(title,id>=0?shuf(qs):qs,id);return}
  const q=qs[i];
  app.innerHTML=`<button class="back" id="bk">← Catalogue</button><h1>${title}</h1><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><p>Question ${i+1} / ${qs.length}</p>${q.p?`<details class="q" open><summary>📖 Texte</summary><p class="rd">${q.p}</p></details>`:''}<div class="q"><div class="s">${q.q.replace('___','<b>_____</b>')}</div><div id="in"></div><div class="fb" id="fb"></div><div id="nx"></div></div>`;

  function done(good,given){if(good)sc++;else miss.push({q,given,ti:q.t??id});fb.style.color=good?'var(--ok)':'var(--ko)';fb.textContent=good?'Correct !':'Réponse : '+q.a[0];
   nx.innerHTML=`<button class="go" id="n">${i+1<qs.length?'Suivant':'Voir le score'}</button>`;const n=document.getElementById('n');n.onclick=()=>{i++;step()};n.focus()}

const TH=[
`<b>Je suis, tu es…</b> I am · you are · he/she/it is · we/you/they are. Contractions : I'm, you're, he's.<br><b>Négatif :</b> + not (isn't, aren't). <b>Question :</b> inversion (<i>Are you tired?</i>). L'âge : <i>I am 25</i> (jamais have).`,
`<b>have</b> avec I/you/we/they, <b>has</b> avec he/she/it. Négatif et question avec do/does : <i>I don't have a car. Does she have a car?</i><br><i>have</i> = aussi manger/prendre : <i>have breakfast</i>.`,
`<b>a</b> + consonne (a book), <b>an</b> + son voyelle (an apple, an hour), <b>the</b> = le/la/les, quand on sait de quoi on parle (the sun).<br>Pas d'article pour une généralité : <i>I like music.</i>`,
`Pour les habitudes et les faits. Verbe de base, <b>+s</b> à he/she/it : <i>she works</i>.<br><b>-es</b> après s, sh, ch, x, o (watches, goes) ; consonne+y → <b>-ies</b> (studies).<br>Adverbes (always, often, never) avant le verbe, après <i>be</i>.`,
`Négatif : <b>don't / doesn't</b> + verbe de base. Question : <b>Do / Does</b> + sujet + verbe de base.<br>Après does, plus de -s : <i>Does she work?</i> Réponses : <i>Yes, she does. / No, she doesn't.</i>`,
`<b>There is</b> + singulier, <b>there are</b> + pluriel : <i>There is a book. There are two chairs.</i><br>Négatif : isn't / aren't (+ any). Question : <i>Is there…? Are there…?</i>`,
`I→<b>my</b>, you→<b>your</b>, he→<b>his</b>, she→<b>her</b>, it→<b>its</b>, we→<b>our</b>, they→<b>their</b>.<br>Ils s'accordent avec le possesseur, pas avec l'objet : <i>his mother, her brother</i>. Ils ne changent pas au pluriel.`,
`<b>in</b> = dans, ville, pays (in Antwerp). <b>on</b> = sur, au contact (on the table). <b>at</b> = point précis (at home, at school, at the bus stop).`,
`<b>can</b> = pouvoir / savoir, identique à toutes les personnes (pas de -s). Négatif : can't / cannot. Question : <i>Can you help?</i><br>Suivi du verbe de base : <i>She can play the piano.</i>`,
`<b>be + verbe en -ing</b> pour une action en cours : <i>I am reading.</i> Négatif : isn't / aren't + -ing. Question : <i>Are you working?</i><br>Orthographe : make → making, run → running.`,
`<b>Simple</b> = habitudes et états durables (<i>I drink coffee. She lives in Paris.</i>).<br><b>Continu</b> = action en cours maintenant (<i>It is raining.</i>).<br>Mots-clés : usually, every day / now, at the moment, look!`,
`Passé de <i>be</i> : <b>was</b> (I, he, she, it), <b>were</b> (you, we, they). Négatif : wasn't / weren't. Question : <i>Was she tired?</i>`,
`Verbe + <b>-ed</b> : played. Verbe en -e : + d (moved). Consonne+y → <b>-ied</b> (studied). Mot court voyelle+consonne : on double (stopped).<br>Même forme à toutes les personnes.`,
`Beaucoup de verbes sont à apprendre par cœur : go→went, make→made, see→saw, take→took, eat→ate, have→had, buy→bought, come→came, get→got.`,
`Négatif : <b>didn't</b> + base. Question : <b>Did</b> + sujet + base.<br>Après did, le verbe reste à la base : <i>Did he arrive?</i> (pas arrived). Avec was/were, on n'utilise pas did.`,
`<b>will</b> : décision spontanée, prédiction, promesse (<i>I'll help you.</i>).<br><b>be going to</b> : plan déjà décidé, ou preuve présente (<i>Look at the clouds!</i>). Négatif de will : won't.`,
`Mot court : <b>-er / -est</b> (fast, faster, the fastest ; big, bigger ; happy, happier). Mot long : <b>more / the most</b> (more interesting).<br>Irréguliers : good→better→best, bad→worse→worst. Comparaison avec <i>than</i>.`,
`<b>some</b> : phrases affirmatives et offres (<i>I have some friends.</i>). <b>any</b> : négation et question (<i>I don't have any milk. Do you have any?</i>).`,
`<b>many</b> + dénombrable (many books), <b>much</b> + indénombrable (much time), surtout en négation et question. En affirmatif : <b>a lot of</b>.<br><i>How much money? How many books?</i>`,
`<b>have / has + participe passé</b>. Pour une expérience (<i>I have been to Spain.</i>), un résultat présent, un état qui continue.<br>Mots : ever, never, just, already, yet. Participes : go→gone/been, see→seen, eat→eaten.`,
`<b>Passé simple</b> = moment fini et précisé (yesterday, in 2015, last week).<br><b>Present perfect</b> = lien avec le présent, moment non précisé (ever, never, this week, since).`,
`<b>for</b> + durée (for three years). <b>since</b> + point de départ (since 2019).<br>Avec le present perfect : <i>I've lived here for 5 years / since 2021.</i>`,
`<b>should</b> = conseil. <b>must</b> = obligation forte ou déduction. <b>mustn't</b> = interdit. <b>don't have to</b> = pas obligé. <b>can / may</b> = permission.<br>Toujours suivis de la base, sans -s.`,
`Situation réelle ou probable : <b>If + présent, will + base</b>.<br><i>If it rains, I will stay home.</i> Pas de will dans la partie avec if.`,
`Situation imaginaire : <b>If + passé, would + base</b>.<br><i>If I were rich, I would travel.</i> Avec <i>be</i>, on dit <i>were</i> pour toutes les personnes.`,
`<b>who</b> = personne, <b>which / that</b> = chose, <b>where</b> = lieu, <b>whose</b> = possession.<br><i>The man who lives here is a doctor.</i>`,
`<b>be + participe passé</b> : l'action compte plus que l'auteur. Présent : <i>English is spoken.</i> Passé : <i>The window was broken.</i><br>Auteur avec <i>by</i> : <i>It was made by my mum.</i>`,
`<b>and</b> (ajout), <b>but</b> (opposition), <b>so</b> (conséquence), <b>because</b> (cause), <b>although</b> (bien que, + sujet + verbe), <b>however</b> (cependant, début de phrase + virgule).`,
`<b>Passé continu</b> (was/were + -ing) : action en cours dans le passé, souvent interrompue (<i>I was cooking when he called.</i>).<br><b>used to</b> + base : habitude passée terminée (<i>I used to play outside.</i>).`,
`On recule d'un temps : am→was, like→liked, will→would. Les questions gardent l'ordre affirmatif : <i>She asked where I lived.</i><br>Ordres : <i>He told me not to go.</i>`
];

TH[0]=`<h3>Conjugaison au présent</h3>`+tb(['Pronom','Complet','Contracté','Français'],[['I','I am',e("I'm"),'je suis'],['you','you are',e("you're"),'tu es / vous êtes'],['he / she / it','he is',e("he's / she's / it's"),'il / elle est'],['we','we are',e("we're"),'nous sommes'],['they','they are',e("they're"),'ils / elles sont']])+`<h3>Négatif : on ajoute not</h3>`+tb(['Sujet','Négatif','Contracté'],[['I','I am not',e("I'm not")],['he / she / it','is not',e("isn't")],['you / we / they','are not',e("aren't")]])+`<h3>Question : on inverse</h3>`+bx(`${e('You are ready.')} → ${e('Are you ready?')}<br>${e('She is a doctor.')} → ${e('Is she a doctor?')}<br>Réponses courtes : ${e('Yes, I am. / No, I\'m not.')} ${e('Yes, he is. / No, he isn\'t.')}`)+`<h3>Quand l'utiliser</h3>`+ls([`Identité, métier : ${e('I am a teacher.')}`,`Origine : ${e('She is from Spain.')}`,`État, sentiment : ${e('We are tired.')}`,`Âge : ${e('I am 25.')}`,`Météo : ${e('It is cold.')}`])+bx(`❌ <i>I have 25 years.</i> ✅ ${e('I am 25.')}<br>❌ <i>Yes, I'm.</i> ✅ ${e('Yes, I am.')} (pas de contraction en fin de phrase)<br>Le sujet est obligatoire : ${e('It is raining.')}`,'warn');
TH[1]=`<h3>Conjugaison au présent</h3>`+tb(['Pronom','Forme','Exemple'],[['I / you / we / they',e('have'),'I have a dog.'],['he / she / it',e('has'),'She has two brothers.']])+`<h3>Négatif et question : avec do / does</h3>`+tb(['','Avec I/you/we/they','Avec he/she/it'],[['Négatif',e("I don't have a car."),e("He doesn't have a car.")],['Question',e('Do you have a pen?'),e('Does she have a pen?')],['Réponse',e("Yes, I do. / No, I don't."),e("Yes, she does. / No, she doesn't.")]])+`<h3>Utilisations</h3>`+ls([`Possession : ${e('I have a bike.')}`,`Famille, amis : ${e('She has three sisters.')}`,`Maladie : ${e('I have a cold. / a headache.')}`,`Repas, activités : ${e('have breakfast, have a shower, have a drink')}`,`Obligation : ${e('I have to work.')} (voir la fiche des modaux)`])+bx(`En anglais britannique, on entend aussi <b>have got</b> : ${e("I've got a car.")} = ${e('I have a car.')}<br>Après <i>does</i>, on écrit <b>have</b> : ❌ <i>Does she has…?</i> ✅ ${e('Does she have…?')}`,'tip');
TH[3]=`<h3>Quand l'utiliser</h3>`+ls([`Habitudes : ${e('I drink coffee every morning.')}`,`Vérités générales : ${e('Water boils at 100°C.')}`,`Horaires : ${e('The train leaves at 8.')}`,`Goûts, états : ${e('She likes jazz. He knows the answer.')}`])+`<h3>Formation : verbe de base, + s à he / she / it</h3>`+tb(['Pronom','work','study','watch'],[['I / you / we / they','work','study','watch'],['he / she / it',e('works'),e('studies'),e('watches')]])+`<h3>Règles du « s »</h3>`+tb(['Cas','Règle','Exemples'],[['Général','+ s','works, plays, lives'],['s, sh, ch, x, o, z','+ es','passes, washes, watches, goes'],['consonne + y','y → ies','study → studies, try → tries'],['voyelle + y','+ s','play → plays, say → says'],['Irrégulier','have → has','she has']])+`<h3>Adverbes de fréquence</h3>`+tb(['Adverbe','Sens','Exemple'],[['always','toujours (100 %)',e('I always eat breakfast.')],['usually','d\'habitude',e('She usually walks.')],['often','souvent',e('We often go out.')],['sometimes','parfois',e('He sometimes cooks.')],['rarely','rarement',e('I rarely drink tea.')],['never','jamais (0 %)',e('They never smoke.')]])+bx(`Placés <b>avant</b> le verbe, mais <b>après</b> <i>be</i> : ${e('He is often late.')}`,'tip')+bx(`Mots repères : every day, on Mondays, in the morning, once a week.`);
TH[4]=`<h3>Négatif et question</h3>`+tb(['','Forme','Exemple'],[['Négatif (I/you/we/they)',"don't + base",e("I don't like fish.")],['Négatif (he/she/it)',"doesn't + base",e("She doesn't like fish.")],['Question (I/you/we/they)','Do + sujet + base',e('Do you speak English?')],['Question (he/she/it)','Does + sujet + base',e('Does he speak English?')]])+`<h3>Réponses courtes</h3>`+bx(`${e('Do you like tea? — Yes, I do. / No, I don\'t.')}<br>${e('Does she work here? — Yes, she does. / No, she doesn\'t.')}`)+`<h3>Les mots interrogatifs (Wh-questions)</h3>`+tb(['Mot','Sens','Exemple'],[['what','quoi, que',e('What do you eat?')],['where','où',e('Where does he live?')],['when','quand',e('When do they work?')],['who','qui',e('Who do you call?')],['why','pourquoi',e('Why do you study English?')],['how','comment',e('How does it work?')]])+bx(`Ordre : <b>mot interrogatif + do/does + sujet + base</b>.<br>Après <i>does / doesn't</i>, le verbe n'a <b>jamais de -s</b> : ❌ <i>Does she works?</i> ✅ ${e('Does she work?')}`,'warn');
TH[9]=`<h3>Formation : be + verbe-ing</h3>`+tb(['','Forme','Exemple'],[['Affirmatif','sujet + am/is/are + -ing',e("I'm reading. She's reading.")],['Négatif','+ not',e("They aren't working.")],['Question','Am/Is/Are + sujet + -ing',e('Are you listening?')]])+`<h3>Orthographe du -ing</h3>`+tb(['Cas','Règle','Exemple'],[['Général','+ ing','work → working'],['finit par -e','on supprime le e','make → making'],['consonne-voyelle-consonne','on double la consonne','run → running, sit → sitting'],['finit par -ie','ie → ying','lie → lying']])+`<h3>Quand l'utiliser</h3>`+ls([`Action en cours : ${e('I am cooking now.')}`,`Période actuelle : ${e('She is studying for an exam.')}`,`Projet proche : ${e('We are leaving tomorrow.')}`])+`<p>Mots repères : now, at the moment, today, right now, Look! Listen!</p>`+bx(`Certains verbes ne s'emploient pas au continu : <b>know, like, love, want, need, understand, believe</b>.<br>❌ <i>I am wanting a coffee.</i> ✅ ${e('I want a coffee.')}`,'warn');
TH[12]=`<h3>Quand l'utiliser</h3><p>Pour une action <b>terminée</b> à un moment précis du passé : ${e('I played football yesterday.')}</p><h3>Formation : verbe + -ed</h3>`+tb(['Cas','Règle','Exemple'],[['Général','+ ed','work → worked'],['finit par -e','+ d','move → moved'],['consonne + y','y → ied','study → studied'],['voyelle + y','+ ed','play → played'],['consonne-voyelle-consonne','on double','stop → stopped']])+`<h3>Prononciation du -ed</h3>`+tb(['Son','Après','Exemples'],[['/t/','p, k, f, s, ch, sh','worked, washed'],['/d/','voyelle ou son sonore','played, opened'],['/ɪd/','t, d','wanted, needed']])+`<h3>Négatif et question : did</h3>`+tb(['','Forme','Exemple'],[['Négatif',"didn't + base",e("I didn't play.")],['Question','Did + sujet + base',e('Did you play?')],['Réponse',"Yes, I did. / No, I didn't.",'']])+`<p>Mots repères : yesterday, last week, two days ago, in 2020, when I was young.</p>`+bx(`Même forme à toutes les personnes : ${e('I worked, he worked, they worked.')}<br>Après <i>did</i>, retour à la base : ${e('Did she work?')} (pas <i>worked</i>).`,'tip');
TH[13]=`<p>Ces verbes ne prennent pas -ed. Apprends-les par cœur : la 3e colonne sert aussi au present perfect.</p>`+tb(['Base','Passé simple','Participe passé','Français'],[['be','was / were','been','être'],['have','had','had','avoir'],['do','did','done','faire'],['go','went','gone / been','aller'],['come','came','come','venir'],['see','saw','seen','voir'],['take','took','taken','prendre'],['make','made','made','faire, fabriquer'],['get','got','got','obtenir, devenir'],['give','gave','given','donner'],['say','said','said','dire'],['tell','told','told','raconter'],['know','knew','known','savoir, connaître'],['think','thought','thought','penser'],['buy','bought','bought','acheter'],['eat','ate','eaten','manger'],['drink','drank','drunk','boire'],['write','wrote','written','écrire'],['read','read /rɛd/','read /rɛd/','lire'],['speak','spoke','spoken','parler'],['sleep','slept','slept','dormir'],['meet','met','met','rencontrer'],['leave','left','left','partir, quitter'],['find','found','found','trouver'],['lose','lost','lost','perdre'],['pay','paid','paid','payer'],['run','ran','run','courir'],['drive','drove','driven','conduire'],['sit','sat','sat','s\'asseoir'],['put','put','put','mettre']])+bx(`Test : cache les colonnes 2 et 3 et dis-les à voix haute. Puis fais la série d'exercices.`,'tip');
TH[15]=`<h3>Deux façons de parler du futur</h3>`+tb(['','will','be going to'],[['Forme','will + base',"am/is/are going to + base"],['Emploi','décision spontanée, prédiction, promesse, offre','plan déjà décidé, preuve présente'],['Exemple',e("I'll help you."),e("I'm going to visit my aunt.")],['Exemple',e('I think it will rain.'),e('Look at the clouds! It is going to rain.')],['Négatif',e("It won't work."),e("She isn't going to come.")],['Question',e('Will you come?'),e('Are you going to eat?')]])+`<h3>Contraction</h3>`+bx(`${e("I will → I'll")} · ${e("you will → you'll")} · ${e("will not → won't")}`)+`<h3>Mots repères</h3><p>tomorrow, next week, next year, soon, in two days, tonight.</p>`+bx(`Pas de verbe conjugué après <i>will</i> : ${e('He will go.')} (jamais <i>wills</i> ni <i>will goes</i>).`,'warn');
TH[16]=`<h3>Formation</h3>`+tb(['Type d\'adjectif','Comparatif','Superlatif','Exemple'],[['Court (1 syllabe)','adj + er','the + adj + est',e('fast, faster, the fastest')],['Finit par -e','+ r / + st',"",e('nice, nicer, the nicest')],['consonne-voyelle-consonne','on double',"",e('big, bigger, the biggest')],['consonne + y','y → ier / iest',"",e('happy, happier, the happiest')],['Long (2 syllabes ou +)','more + adj','the most + adj',e('interesting, more interesting, the most interesting')],['Irréguliers','','',e('good, better, best · bad, worse, worst · far, farther, farthest')]])+`<h3>Les structures</h3>`+tb(['Structure','Exemple'],[['comparatif + than',e('A car is faster than a bike.')],['as + adj + as (égalité)',e('She is as tall as her brother.')],['not as + adj + as',e('This is not as expensive as that.')],['the + superlatif + in/of',e('He is the tallest in the class.')]])+bx(`Après un comparatif, on utilise <b>than</b> (pas <i>that</i>) : ${e('bigger than')}.`,'warn');
TH[19]=`<h3>Formation : have / has + participe passé</h3>`+tb(['','Forme','Exemple'],[['Affirmatif','have/has + participe',e("I've seen it. She has left.")],['Négatif',"haven't / hasn't + participe",e("We haven't finished.")],['Question','Have/Has + sujet + participe',e('Have you ever been to Rome?')]])+`<h3>Quand l'utiliser</h3>`+ls([`Expérience de vie : ${e('I have visited Spain twice.')}`,`Résultat présent : ${e('I have lost my keys.')} (je ne les ai pas maintenant)`,`Durée jusqu'à maintenant : ${e('She has lived here for five years.')}`,`Action très récente : ${e('He has just arrived.')}`])+`<h3>Les mots qui l'accompagnent</h3>`+tb(['Mot','Sens','Place / exemple'],[['ever','déjà (question)',e('Have you ever eaten sushi?')],['never','jamais',e("I've never flown.")],['just','à l\'instant',e("She's just left.")],['already','déjà',e("I've already eaten.")],['yet','encore, déjà (fin)',e("Have you finished yet? I haven't finished yet.")],['for / since','durée / début',e("for 3 years, since 2020")]])+bx(`<b>have been to</b> = être allé et revenu : ${e('I have been to Paris.')}<br><b>have gone to</b> = parti, pas encore revenu : ${e('He has gone to Paris.')}<br>Pas de moment précis avec le present perfect : ❌ <i>I have seen him yesterday.</i> ✅ ${e('I saw him yesterday.')}`,'warn')+`<p>Les participes passés sont dans la fiche des verbes irréguliers.</p>`;
TH[22]=`<h3>Les modaux principaux</h3>`+tb(['Modal','Sens','Exemple','Négatif'],[['can','capacité, permission',e('I can swim.'),"can't / cannot"],['could','capacité passée, demande polie',e('Could you help me?'),"couldn't"],['may','permission, possibilité',e('May I come in?'),'may not'],['should','conseil',e('You should rest.'),"shouldn't"],['must','obligation forte, déduction',e('You must stop. He must be home.'),"mustn't (interdit)"],['have to','obligation (règle extérieure)',e('I have to work.'),"don't have to (pas obligé)"]])+`<h3>Règles communes</h3>`+ls([`Même forme à toutes les personnes : ${e('she can')}, jamais <i>cans</i>.`,`Suivis du verbe de base sans <i>to</i> : ${e('I must go.')}`,`Négation et question sans do/does : ${e("Can you swim? I can't swim.")}`])+bx(`<b>mustn't</b> = c'est interdit : ${e("You mustn't smoke here.")}<br><b>don't have to</b> = ce n'est pas nécessaire : ${e("You don't have to come.")}<br>Ils n'ont pas le même sens !`,'warn');
TH[23]=`<h3>Structure</h3>`+tb(['Partie "if"','Partie résultat','Exemple'],[['If + présent simple','will + base',e('If it rains, I will stay home.')],['If + présent simple','impératif',e('If you see him, call me.')],['If + présent simple','can / may / should + base',e('If you are tired, you should rest.')]])+`<h3>Ordre des parties</h3>`+bx(`${e('If it rains, I will stay home.')}<br>${e('I will stay home if it rains.')} (sans virgule quand if est au milieu)`)+`<h3>Autres mots utiles</h3>`+tb(['Mot','Sens','Exemple'],[['unless','à moins que (= if … not)',e("Unless you hurry, you'll be late.")],['when','quand (c\'est certain)',e('When I arrive, I will call you.')],['as soon as','dès que',e("I'll call you as soon as I arrive.")]])+bx(`Pas de <i>will</i> dans la partie avec <i>if</i> : ❌ <i>If it will rain…</i> ✅ ${e('If it rains…')}`,'warn');

TH[2]=`<h3>Les trois articles</h3>`+tb(['Article','Emploi','Exemple'],[['a','devant un son consonne, une chose parmi d\'autres',e('a book, a university')],['an','devant un son voyelle',e('an apple, an hour')],['the','chose connue ou unique, singulier ou pluriel',e('the sun, the books')],['(rien)','pluriel ou indénombrable en général',e('I like music. Dogs are loyal.')]])+`<h3>Règles</h3>`+ls([`<b>a / an</b> : on regarde le <b>son</b>, pas la lettre : ${e('an hour')} (h muet), ${e('a university')} (son « you »).`,`<b>a / an</b> n'existent qu'au singulier : ${e('a car')} → ${e('cars')}.`,`<b>the</b> : quand on a déjà parlé de la chose : ${e('I have a dog. The dog is big.')}`,`<b>Pas d'article</b> : langues, repas, sports, pays sans mot « pluriel » : ${e('I speak English. We have lunch. She plays tennis.')}`])+bx(`Métier : on met <b>a / an</b> : ${e('He is a doctor.')} (jamais <i>He is doctor.</i>)`,'warn');
TH[5]=`<h3>Il y a</h3>`+tb(['','Singulier','Pluriel'],[['Affirmatif',e('There is a book.'),e('There are two books.')],['Négatif',e("There isn't a book. / There isn't any milk."),e("There aren't any books.")],['Question',e('Is there a bank near here?'),e('Are there any shops?')],['Réponse',e("Yes, there is. / No, there isn't."),e("Yes, there are. / No, there aren't.")]])+`<h3>Contractions</h3>`+bx(`${e("there is → there's")} · ${e("there is not → there isn't")} · ${e("there are not → there aren't")}`)+bx(`On accorde avec le nom qui suit : ${e('There is a cat and two dogs.')} (le premier nom décide, <i>a cat</i>).<br><b>There is</b> = il y a (existence). <b>It is</b> = c'est (description) : ${e('It is a big house.')}`,'tip');
TH[6]=`<h3>Adjectifs possessifs (devant un nom)</h3>`+tb(['Sujet','Adjectif','Exemple'],[['I',e('my'),'my book'],['you',e('your'),'your car'],['he',e('his'),'his mother'],['she',e('her'),'her brother'],['it',e('its'),'its tail'],['we',e('our'),'our house'],['they',e('their'),'their friends']])+`<h3>Pronoms possessifs (sans nom)</h3>`+tb(['Adjectif','Pronom','Exemple'],[['my',e('mine'),e('This book is mine.')],['your',e('yours'),e('Is this yours?')],['his / her',e('his / hers'),e('The bag is hers.')],['our',e('ours'),e('The car is ours.')],['their',e('theirs'),e('These are theirs.')]])+`<h3>Le possessif avec \'s</h3>`+tb(['Cas','Règle','Exemple'],[['Nom singulier',"+ 's",e("Tom's car")],['Pluriel en -s',"+ '",e("the students' books")]])+bx(`On accorde avec le <b>possesseur</b> : ${e('Sarah loves her brother.')} / ${e('Tom loves his sister.')}<br>❌ <i>it's</i> (it is) ≠ ✅ <i>its</i> (possessif).`,'warn');
TH[7]=`<h3>Prépositions de lieu</h3>`+tb(['Préposition','Emploi','Exemple'],[['in','à l\'intérieur, ville, pays',e('in the box, in Antwerp, in Belgium')],['on','sur, au contact, rue',e('on the table, on the wall, on Main Street')],['at','point précis, endroit',e('at home, at school, at the bus stop')],['under / over','sous / au-dessus',e('under the bed')],['next to / behind','à côté de / derrière',e('next to the bank')],['in front of / between','devant / entre',e('between the shop and the bank')]])+`<h3>Prépositions de temps</h3>`+tb(['Préposition','Emploi','Exemple'],[['at','heure, moment précis',e('at 8 o\'clock, at night, at the weekend')],['on','jour, date',e('on Monday, on 5 May')],['in','mois, année, saison, partie du jour',e('in June, in 2020, in summer, in the morning')]])+bx(`À retenir : <b>at</b> = point, <b>on</b> = surface/jour, <b>in</b> = espace ou durée plus large.<br>Expressions : ${e('at home, at work, at school, in bed, on time, in time')}.`,'tip');
TH[8]=`<h3>Forme</h3>`+tb(['','Forme','Exemple'],[['Affirmatif','sujet + can + base',e('She can swim.')],['Négatif',"can't / cannot + base",e("I can't see you.")],['Question','Can + sujet + base',e('Can you help me?')],['Réponse',"Yes, I can. / No, I can't.",'']])+`<h3>Emplois</h3>`+ls([`Capacité : ${e('I can speak French.')}`,`Permission : ${e('You can go now.')}`,`Demande : ${e('Can you open the door?')} (plus poli : ${e('Could you…?')})`,`Possibilité : ${e('It can be dangerous.')}`])+`<h3>Au passé : could</h3>`+bx(`${e('When I was five, I could swim.')} · ${e("I couldn't find my keys.")}`)+bx(`Pas de <i>-s</i> à he/she/it : ❌ <i>She cans</i> ✅ ${e('She can')}.<br>Pas de <i>to</i> après can : ✅ ${e('I can go')}.`,'warn');
TH[10]=`<h3>Comparaison</h3>`+tb(['','Présent simple','Présent continu'],[['Forme','verbe de base (+ s)','be + verbe-ing'],['Sens','habitude, fait, état','action en cours maintenant'],['Exemple',e('I drink tea every day.'),e('I am drinking tea now.')],['Mots repères','always, usually, every day, never','now, at the moment, today, Look!'],['Exemple',e('She lives in Paris.'),e('She is staying in Paris this week.')]])+`<h3>Verbes d'état (pas de continu)</h3>`+bx(`like, love, hate, want, need, know, understand, believe, have (posséder)<br>${e('I know the answer.')} (jamais <i>I am knowing</i>)`)+bx(`Question utile : est-ce que l'action est <b>régulière</b> (simple) ou <b>en train de se passer</b> (continu) ?`,'tip');
TH[11]=`<h3>Conjugaison</h3>`+tb(['Pronom','Affirmatif','Négatif','Question'],[['I / he / she / it',e('was'),e("wasn't"),e('Was he…?')],['you / we / they',e('were'),e("weren't"),e('Were you…?')]])+`<h3>Exemples</h3>`+ls([e('I was at home yesterday.'),e('They were happy.'),e("We weren't late."),e('Was she tired? — Yes, she was.')])+`<h3>There was / there were</h3>`+bx(`${e('There was a problem.')} · ${e('There were two cars.')}`)+bx(`<i>was / were</i> sont les passés de <i>am / is / are</i>. On n'utilise pas <i>did</i> avec : ❌ <i>Did you were there?</i> ✅ ${e('Were you there?')}<br>Mots repères : yesterday, last night, in 2019, ago.`,'tip');
TH[14]=`<h3>Négatif et question</h3>`+tb(['','Forme','Exemple'],[['Négatif',"didn't + base",e("She didn't go to school.")],['Question','Did + sujet + base',e('Did you see the film?')],['Wh-question','mot + did + sujet + base',e('What did you do yesterday?')],['Réponse',"Yes, I did. / No, I didn't.",'']])+`<h3>Exemples avec verbes irréguliers</h3>`+tb(['Affirmatif','Négatif','Question'],[[e('He went home.'),e("He didn't go home."),e('Did he go home?')],[e('We ate pizza.'),e("We didn't eat pizza."),e('Did we eat pizza?')]])+bx(`Une seule marque du passé par phrase : <b>did</b> la porte, le verbe reste à la base.<br>❌ <i>Did you went?</i> ✅ ${e('Did you go?')}<br>Exception : avec <i>was / were</i>, pas de did.`,'warn');
TH[17]=`<h3>Some / any</h3>`+tb(['Mot','Emploi','Exemple'],[['some','affirmatif, offres, demandes',e('I have some friends. Would you like some tea?')],['any','négatif et question',e("I don't have any money. Do you have any?")],['no','= not any (sens négatif)',e('There is no milk.')]])+`<h3>Les composés</h3>`+tb(['','some-','any-','no-'],[['personne',e('someone'),e('anyone'),e('no one')],['chose',e('something'),e('anything'),e('nothing')],['lieu',e('somewhere'),e('anywhere'),e('nowhere')]])+bx(`${e('I saw someone.')} · ${e("I didn't see anyone.")} · ${e('I saw no one.')}<br>Pas de double négation : ❌ <i>I don't see nobody.</i>`,'warn');
TH[18]=`<h3>Dénombrable ou indénombrable</h3>`+tb(['Type','Exemples','Quantité'],[['Dénombrable','book, friend, apple (pluriel possible)',e('many, a few, several')],['Indénombrable','water, money, time, advice, information',e('much, a little')],['Les deux','','a lot of, lots of, some, any']])+`<h3>Questions et négations</h3>`+tb(['Structure','Exemple'],[['How many + pluriel',e('How many books do you read?')],['How much + indénombrable',e('How much time do you have?')],['not many / not much',e("I don't have many friends. I don't have much time.")]])+`<h3>Few / a few, little / a little</h3>`+tb(['Mot','Sens','Exemple'],[['a few','quelques (positif)',e('I have a few friends.')],['few','très peu (négatif)',e('Few people came.')],['a little','un peu (positif)',e('I have a little time.')],['little','très peu (négatif)',e('There is little water.')]])+bx(`En phrase affirmative, on préfère <b>a lot of</b> : ${e('I have a lot of friends.')} (pas <i>much</i>).`,'tip');
TH[20]=`<h3>Quel temps choisir ?</h3>`+tb(['','Passé simple','Present perfect'],[['Sens','action finie, moment précis','lien avec le présent, moment non précisé'],['Mots repères','yesterday, last week, in 2015, ago, when','ever, never, just, already, yet, so far, this week'],['Exemple',e('I saw him yesterday.'),e("I've seen him three times this week.")],['Exemple',e('She lived in Rome in 2010.'),e('She has lived in Rome since 2010.')],['Question',e('When did you arrive?'),e('Have you ever been to Rome?')]])+bx(`Si on dit <b>quand</b> (une date, hier, il y a…) → <b>passé simple</b>.<br>Si on parle de l'<b>expérience</b> ou d'une <b>période pas finie</b> (this week, so far) → <b>present perfect</b>.<br>❌ <i>I have seen him yesterday.</i> ✅ ${e('I saw him yesterday.')}`,'tip');
TH[21]=`<h3>For ou since ?</h3>`+tb(['Mot','Sens','Après le mot','Exemple'],[['for','pendant (durée)','une durée : 3 days, a week, years',e("I've lived here for five years.")],['since','depuis (début)','un point de départ : 2019, Monday, June',e("I've lived here since 2019.")]])+`<h3>Autres exemples</h3>`+ls([e("She has worked here for two months."),e("He hasn't called since Monday."),e("We've known each other since school.")])+bx(`En anglais, on utilise le <b>present perfect</b> avec for / since : ❌ <i>I live here since 2019.</i> ✅ ${e("I've lived here since 2019.")}<br>Question : ${e('How long have you lived here?')}`,'warn');
TH[24]=`<h3>Structure</h3>`+tb(['Partie "if"','Résultat','Exemple'],[['If + passé simple','would + base',e('If I had money, I would travel.')],['If + were (toutes personnes)','would + base',e('If I were you, I would wait.')],['If + passé simple','could / might + base',e('If she tried, she could win.')]])+`<h3>Quand l'utiliser</h3>`+ls([`Situation imaginaire ou peu probable : ${e('If I won the lottery, I would buy a house.')}`,`Conseil : ${e('If I were you, I would study more.')}`])+`<h3>Conditionnel 1 ou 2 ?</h3>`+tb(['','Conditionnel 1','Conditionnel 2'],[['Sens','possible','imaginaire'],['Structure','If + présent, will','If + passé, would'],['Exemple',e('If I have time, I will call.'),e('If I had time, I would call.')]])+bx(`Le passé après <i>if</i> n'exprime pas le passé, mais l'irréel. Avec <i>be</i>, on dit <b>were</b> : ${e('If he were here…')}`,'tip');
TH[25]=`<h3>Les pronoms relatifs</h3>`+tb(['Pronom','Pour','Exemple'],[['who','personne (sujet)',e('The man who lives here is a doctor.')],['which','chose',e('The book which I read was great.')],['that','personne ou chose',e('The film that we saw was long.')],['where','lieu',e('This is the town where I was born.')],['whose','possession',e('She is the woman whose car was stolen.')]])+`<h3>Règles</h3>`+ls([`<b>who</b> ne s'emploie que pour les personnes, <b>which</b> pour les choses.`,`<b>that</b> peut remplacer who ou which dans la conversation.`,`Quand le relatif est l'objet, on peut l'omettre : ${e('The book (that) I read was great.')}`,`<b>whose</b> + nom : ${e('whose car')}`])+bx(`Pas de pronom personnel en plus : ❌ <i>The man who he lives here.</i> ✅ ${e('The man who lives here.')}`,'warn');
TH[26]=`<h3>Formation : be + participe passé</h3>`+tb(['Temps','Forme','Exemple'],[['Présent simple','am/is/are + participe',e('English is spoken here.')],['Passé simple','was/were + participe',e('The window was broken.')],['Present perfect','have/has been + participe',e('The work has been done.')],['Futur','will be + participe',e('It will be finished soon.')]])+`<h3>Quand l'utiliser</h3>`+ls([`L'action compte plus que l'auteur : ${e('My bike was stolen.')}`,`L'auteur est inconnu : ${e('The shop is closed on Sundays.')}`])+`<h3>Actif → passif</h3>`+tb(['Actif','Passif'],[[e('My mum made the cake.'),e('The cake was made by my mum.')],[e('They speak English here.'),e('English is spoken here.')]])+bx(`L'objet de l'actif devient le sujet du passif. L'auteur s'ajoute avec <b>by</b>, mais seulement si c'est utile.`,'tip');
TH[27]=`<h3>Les connecteurs</h3>`+tb(['Connecteur','Sens','Exemple'],[['and','ajout',e('I like tea and coffee.')],['but','opposition',e('She is smart but lazy.')],['or','choix',e('Tea or coffee?')],['so','conséquence',e('I was tired, so I went to bed.')],['because','cause',e('I stayed home because it was raining.')],['although','bien que',e('Although it was cold, we went out.')],['however','cependant',e('He is rich. However, he is not happy.')],['therefore','donc, par conséquent',e('It was late. Therefore, we left.')],['first, then, finally','ordre',e('First, mix. Then, bake. Finally, eat.')]])+bx(`<b>because</b> + sujet + verbe : ${e('because it was cold')}.<br><b>because of</b> + nom : ${e('because of the rain')}.<br><b>however</b> commence une phrase et est suivi d'une virgule.<br><b>although</b> n'est jamais suivi de <i>but</i> : ❌ <i>Although it was cold, but we went out.</i>`,'tip');
TH[28]=`<h3>Le passé continu</h3>`+tb(['','Forme','Exemple'],[['Affirmatif','was/were + -ing',e('I was watching TV.')],['Négatif',"wasn't / weren't + -ing",e("They weren't sleeping.")],['Question','Was/Were + sujet + -ing',e('What were you doing?')]])+bx(`Action <b>en cours</b> dans le passé, souvent interrompue : ${e('I was cooking when he called.')}<br>Deux actions en même temps : ${e('I was reading while he was cooking.')}<br>Mots : while, when, at 8 o'clock yesterday.`)+`<h3>Used to : habitude passée</h3>`+tb(['','Forme','Exemple'],[['Affirmatif','used to + base',e('I used to play outside.')],['Négatif',"didn't use to + base",e("She didn't use to smoke.")],['Question','Did + sujet + use to',e('Did you use to live here?')]])+bx(`<i>used to</i> parle d'une habitude ou d'un état <b>fini</b> : ${e('He used to be shy.')}<br>Il n'existe qu'au passé. Pour le présent, on dit ${e('I usually…')}`,'tip');

function review(m){
 if(!m.length)return '';
 let h=`<div class="rv"><h2>Pourquoi ces erreurs ?</h2><p>${m.length} erreur${m.length>1?'s':''}. Pour chacune : ta réponse, la bonne réponse, puis un extrait de la fiche à relire.</p>`;
 m.forEach(x=>{if(x.q.r){h+=`<div class="q"><div class="s">${x.q.q}</div><p>Ta réponse : <span class="k">${x.given}</span><br>Bonne réponse : <span class="g">${x.q.a[0]}</span></p><p>Dans le texte : <span class="en">… ${x.q.e} …</span></p></div>`;return}if(x.q.v){h+=`<div class="q"><div class="s">${x.q.q}</div><p>Ta réponse : <span class="k">${x.given}</span><br>Bonne réponse : <span class="g">${x.q.a[0]}</span></p><p>À retenir : <span class="en">${x.q.w[0]}</span> = ${x.q.w[1]} (thème : ${x.q.c})</p></div>`;return}
  const d=D[x.ti],box=document.createElement('div');box.innerHTML=TH[x.ti];
  const k=box.querySelector('.box.warn')||box.querySelector('.box.tip')||box.querySelector('.box'),t=box.querySelector('table'),h3=box.querySelector('h3');
  if(t){[...t.querySelectorAll('tr')].slice(9).forEach(r=>r.remove())}
  const ok=x.q.q.replace(/\s*\([^)]*\)\s*$/,'').replace('___',x.q.a[0]);
  h+=`<div class="q"><div class="s">${x.q.q.replace('___','<b>_____</b>')}</div>
  <p>Ta réponse : <span class="k">${x.given||'(vide)'}</span><br>Bonne réponse : <span class="g">${x.q.a[0]}</span></p>
  <p>Phrase correcte : <span class="en">${ok}</span></p>
  <div class="th"><h3>Extrait de la fiche « ${d[1]} » (${d[0]})</h3>${h3&&t?'<p><b>'+h3.textContent+'</b></p>':''}${t?t.parentNode.outerHTML:''}${k?k.outerHTML:''}</div>
  <details><summary>Relire toute la fiche</summary><div class="th">${TH[x.ti]}</div></details></div>`;
 });
 return h+'</div>';
}

function vquiz(title,pool){
 const qs=shuf(pool).slice(0,10).map(p=>{const d=Math.random()<.5,ans=d?p.fr:p.en;
  const o=[...new Set([ans,...shuf(pool.map(x=>d?x.fr:x.en).filter(x=>x!==ans)).slice(0,3)])];
  return{q:d?`Que veut dire « ${p.en} » ?`:`Comment dit-on « ${p.fr} » en anglais ?`,a:[ans],o,v:1,w:[p.en,p.fr],c:p.c}});
 run(title,qs,-1);
}

}

TH[30]=`<h3>Conditionnel 3 : regret sur le passé</h3>`+tb(['Partie if','Résultat','Exemple'],[['If + past perfect','would have + participe passé',e('If I had studied, I would have passed.')],['If + past perfect','could / might have + participe',e('If she had asked, we could have helped.')]])+bx(`Situation <b>impossible</b>, car le passé ne change plus : ${e('If I had known, I would have come.')} (je ne savais pas, donc je ne suis pas venu).`)+`<h3>Wish : exprimer un regret</h3>`+tb(['Situation','Structure','Exemple'],[['Regret présent','wish + passé simple',e('I wish I had more time.')],['Regret passé','wish + past perfect',e('I wish I had gone to the party.')],['Agacement, changement souhaité','wish + would',e('I wish he would stop talking.')]])+bx(`Après <i>wish</i>, on dit <b>were</b> à toutes les personnes : ${e('I wish I were taller.')}<br>Pas de <i>would</i> dans la partie if : ❌ <i>If I would have known</i> ✅ ${e('If I had known')}`,'warn')+`<h3>Les 4 conditionnels</h3>`+tb(['Type','Structure','Sens'],[['Zéro','if + présent, présent','vérité générale'],['1','if + présent, will','possible'],['2','if + passé, would','imaginaire'],['3','if + past perfect, would have','passé irréel']]);
TH[31]=`<h3>Principe</h3><p>Après certains adverbes négatifs placés en début de phrase, on <b>inverse</b> le sujet et l'auxiliaire, comme dans une question. C'est un style formel.</p>`+tb(['Expression','Exemple'],[['never / rarely / seldom',e('Never have I seen such a view.')],['hardly … when / no sooner … than',e('Hardly had she arrived when it rained.')],['not only … but also',e('Not only was he late, but he forgot the keys.')],['under no circumstances',e('Under no circumstances should you open it.')],['only when / only after',e('Only when I left did I understand.')],['little',e('Little did he know the truth.')]])+bx(`Sans auxiliaire dans la phrase normale, on ajoute <b>do / does / did</b> : ${e('Rarely do we find such honesty.')}<br>Avec un temps composé, l'auxiliaire passe devant le sujet : ${e('Had I known, I would have come.')}`,'tip')+`<h3>Inversion conditionnelle (sans if)</h3>`+tb(['Avec if','Avec inversion'],[[e('If I had known…'),e('Had I known…')],[e('If you should need help…'),e('Should you need help…')],[e('If I were rich…'),e('Were I rich…')]])+bx(`L'inversion est <b>formelle</b>. À l'oral courant, on garde l'ordre normal.`,'warn');
TH[32]=`<h3>Les phrases clivées (cleft sentences)</h3><p>Elles servent à mettre un élément en valeur.</p>`+tb(['Type','Structure','Exemple'],[['It-cleft','It is/was + élément + that/who',e('It was Maria who solved the problem.')],['What-cleft','What + sujet + verbe + is/was',e('What I need is a holiday.')],['All-cleft','All + sujet + verbe + is',e('All I want is peace.')]])+`<h3>Le subjonctif en anglais</h3>`+tb(['Emploi','Structure','Exemple'],[['Mandatif','suggest / insist / demand that + base',e('I suggest that he see a doctor.')],['Mandatif','it is essential / vital that + base',e('It is essential that she be on time.')],['Irréel','were à toutes les personnes',e('If I were you… / I wish it were true.')]])+bx(`Au subjonctif, <b>pas de -s</b> à he/she/it, et <i>be</i> reste à la base : ${e('He insists that she be present.')} En anglais britannique, on entend aussi <i>should</i> : ${e('…that she should be present.')}`,'tip')+`<h3>Autres structures C2</h3>`+tb(['Structure','Exemple'],[["If it weren't for / Had it not been for",e("If it weren't for your help, I would be lost.")],['Not until + inversion',e('Not until midnight did they arrive.')],['The more…, the more…',e('The more you read, the more you learn.')]]);
